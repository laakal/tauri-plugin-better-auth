[package]
name = "example-tauri-app"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "example_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde_json = "1"
tauri-plugin-better-auth = { path = "../../../../crates/tauri-plugin-better-auth" }
# Versions that support Tauri 2.11 (newer releases require 2.12).
tauri-plugin-deep-link = "~2.4.10"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.4.5", features = ["deep-link"] }
