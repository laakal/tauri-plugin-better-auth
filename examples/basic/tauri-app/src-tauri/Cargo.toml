[package]
name = "example-tauri-app"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "example_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = [] }
# Tauri 3 picks the webview runtime explicitly; the example uses the system
# webview (wry). For Chromium, see the README's "Tauri 3 and CEF" section.
tauri-runtime-wry = "3.0.0-alpha.5"
serde_json = "1"
tauri-plugin-better-auth = { path = "../../../../crates/tauri-plugin-better-auth" }
tauri-plugin-deep-link = "~3.0.0-alpha.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~3.0.0-alpha.3", features = [
  "deep-link",
] }
