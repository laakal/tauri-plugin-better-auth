[package]
name = "example-tauri-app"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "example_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"
tauri-plugin-better-auth = { path = "../../../../crates/tauri-plugin-better-auth" }
# The example tracks the latest Tauri 2; the plugin crate itself supports 2.11+
# (CI's rust-compat job checks it on 2.11.5).
tauri-plugin-deep-link = "2.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
