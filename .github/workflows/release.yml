name: Release

# Releases the npm package and the crate together, from a version tag.
# npm: the version is *staged* (`npm stage publish`); a maintainer approves it
# with 2FA on npmjs.com (Staged Packages) or `npm stage approve <stage-id>`.
# Auth: npm trusted publishing (GitHub OIDC, no secret; configured on the
# package's npmjs.com settings for this workflow). crates.io: CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the versions
        run: |
          node scripts/check-versions.mjs
          test "v$(node -p "require('./packages/tauri-plugin-better-auth/package.json').version")" = "$GITHUB_REF_NAME"

  npm:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test && bun run lint:package
      # Staged publishing needs npm 11.15+.
      - run: npm install -g npm@11
      # Stages the version (with provenance); it goes live only after a
      # maintainer approves it with 2FA. The dist-tag comes from
      # publishConfig.tag (`next` on the v3 line, `latest` otherwise).
      # npm authenticates through trusted publishing (OIDC, `id-token: write`).
      - working-directory: packages/tauri-plugin-better-auth
        run: npm stage publish --provenance --access public

  crate:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: cargo publish -p tauri-plugin-better-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # After both registries succeed: a GitHub Release whose notes are this
  # version's CHANGELOG.md section. Tags with a `-` (e.g. v0.2.0-alpha.0) are
  # marked as pre-releases. The npm version may still await its 2FA approval.
  github-release:
    needs: [crate, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease
