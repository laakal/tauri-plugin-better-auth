name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  js:
    name: JS (check, typecheck, test, package)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: better_auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d better_auth"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: bun run check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
        env:
          TEST_POSTGRES: '1'
      - run: bun run lint:package

  js-compat:
    name: Better Auth ${{ matrix.better-auth }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        better-auth: ['1.7.4', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install
      # Install the exact better-call and @better-fetch/fetch that this Better
      # Auth release ships, as an app would get; mixing versions breaks types.
      - working-directory: packages/tauri-plugin-better-auth
        run: |
          v=${{ matrix.better-auth }}
          bun add -d better-auth@$v @better-auth/core@$v \
            better-call@$(npm view better-auth@$v dependencies.better-call) \
            @better-fetch/fetch@$(npm view better-auth@$v 'dependencies.@better-fetch/fetch')
      - run: bun run build
      - working-directory: packages/tauri-plugin-better-auth
        run: bun run typecheck && bun run test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The plugin's tests run on their own: built together with the example
      # app, cargo unifies Tauri's `common-controls-v6` feature into the test
      # binaries, which then crash on Windows without an app manifest.
      - run: cargo test -p tauri-plugin-better-auth
      - run: cargo build -p example-tauri-app
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --no-deps -p tauri-plugin-better-auth
        env:
          RUSTDOCFLAGS: -D warnings

  rust-compat:
    name: Rust with Tauri 2.11.5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/pin-oldest-tauri.sh
      - run: cargo test -p tauri-plugin-better-auth

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9c73e2f62269c4b1d0240bd5dd1b81de08099bb6 # 1.88.0
        with:
          toolchain: 1.88.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      # Tauri 2.12 needs Rust 1.90; the crate's floor (Tauri 2.11) needs 1.88.
      - run: scripts/pin-oldest-tauri.sh
      - run: cargo check -p tauri-plugin-better-auth --all-features

  e2e:
    name: Protocol end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start the example server
        run: |
          EXAMPLE_TEST_MODE=1 EXAMPLE_DB=$RUNNER_TEMP/e2e.db bun examples/basic/server/src/server.ts &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/api/auth/ok && exit 0; sleep 1; done
          exit 1
      - run: cargo test -p tauri-plugin-better-auth --test protocol_e2e
        env:
          TPBA_E2E_URL: http://localhost:3000

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write # rustsec/audit-check reports through a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
