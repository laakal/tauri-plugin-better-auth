[package]
name = "tauri-plugin-better-auth"
version = "0.2.0-alpha.5"
edition = "2024"
rust-version = "1.95"
description = "Better Auth for Tauri 3: browser sign-in with PKCE, a Rust-held session and a token-free webview."
license = "MIT"
repository = "https://github.com/laakal/tauri-plugin-better-auth"
homepage = "https://github.com/laakal/tauri-plugin-better-auth"
documentation = "https://docs.rs/tauri-plugin-better-auth"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "better-auth", "authentication", "pkce"]
categories = ["authentication", "gui"]
links = "tauri-plugin-better-auth"
exclude = [
  "/tests/fixtures",
  "/.tauri",
  "/ios/.build",
  "/android/.tauri",
  "/android/build",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Register tauri-plugin-single-instance with the `deep-link` feature, or deep links start a second instance." }
linux = { level = "full", notes = "Same single-instance requirement as Windows. The keychain store needs a running Secret Service (GNOME Keyring, KWallet)." }
macos = { level = "full", notes = "Deep links only reach an installed `.app` bundle; `tauri dev` (also the CEF dev bundle under `target/`) falls back to loopback." }
android = { level = "partial", notes = "Sign-in runs in a Custom Tab and returns through tauri-plugin-deep-link (`plugins.deep-link.mobile`). The loopback transport is not available; HTTPS uses the bundled Mozilla roots." }
ios = { level = "partial", notes = "Sign-in runs in an ASWebAuthenticationSession; no deep-link plugin needed. The loopback transport is not available." }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["keyring"]
## OS keychain session storage (macOS and iOS Keychain, Android Keystore, Windows Credential Manager, Linux Secret Service).
keyring = [
  "dep:keyring",
  "dep:keyring-core",
  "dep:apple-native-keyring-store",
  "dep:android-native-keyring-store",
]

[dependencies]
tauri = { version = "3.0.0-alpha.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "http2",
  "charset",
  "system-proxy",
] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# Not used directly: raises the minimum version (RUSTSEC-2026-0382, certificate
# verification accepting distrusted intermediates). `rustls` 0.23.46 above covers
# RUSTSEC-2026-0285 and 0346-0349.
# rust-doctor: allow(rust_doctor::cargo::unused_dependency) -- a version floor, not imported
rustls-webpki = { version = "0.103.16", default-features = false }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
subtle = "2.6"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# The OS certificate verifier. On Android it needs a Kotlin component in the
# app's Gradle build, so the bundled Mozilla roots are used there instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"
android-native-keyring-store = { version = "1", optional = true }

# Mobile opens the sign-in page natively (ASWebAuthenticationSession, Custom
# Tabs), and `keyring`'s `v1` API has no mobile store.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
keyring = { version = "4.2", default-features = false, features = [
  "v1",
], optional = true }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
keyring-core = { version = "1", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = [
  "protected",
], optional = true }

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.4", features = ["build"] }

[dev-dependencies]
tauri = { version = "3.0.0-alpha.5", default-features = false, features = [
  "test",
] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
wiremock = "0.6"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
