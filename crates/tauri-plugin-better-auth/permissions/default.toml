"$schema" = "schemas/schema.json"

[default]
description = """
Browser sign-in, the cached session, sign-out, and authenticated requests through the
auth bridge. The session token is never returned to the webview: no command reads it.
"""
permissions = [
  "allow-request-auth",
  "allow-authenticate",
  "allow-cancel-auth",
  "allow-get-session",
  "allow-sign-out",
  "allow-fetch",
  "allow-fetch-cancel",
]
