# Rust Doctor (https://rust-doctor.com), checked with rust-doctor@0.8.0:
#   npx -y rust-doctor@0.8.0 . --yes --verbose
# Unknown keys and rule ids are errors. Suppress one finding at its site with a
# reason, never file-wide:
#   Rust:  // rust-doctor: allow(<rule id>) -- <why>
#   TOML:  # rust-doctor: allow(<rule id>) -- <why>

# Exit non-zero when a finding reaches `error`.
blocking = "error"

[categories]
security = "error"

[rules]
# Lint exemptions must say why and stay scoped to the item that needs them.
"rust_doctor::structure::unreasoned_allow_attribute" = "error"
"rust_doctor::structure::crate_level_allow" = "error"
# Off: every duplicate comes from the dependency trees of Tauri, keyring and
# hyper (indexmap, toml, syn, schemars, winnow, bitflags, ...), or is thiserror 1
# there next to our thiserror 2. We cannot align them, and downgrading ours would
# go backwards.
"rust_doctor::cargo::duplicate_major_versions" = "off"
# A warning, not an error: CI's `cargo audit` job is the gate for vulnerable
# dependencies. It stays visible so new advisories surface. Known and accepted,
# all Linux-only:
#   glib 0.18 RUSTSEC-2024-0429 (unsound VariantStrIter; fixed only in glib 0.20,
#     which needs GTK4: Tauri 3's CEF runtime) and proc-macro-error (unmaintained,
#     via glib-macros): Tauri's GTK3 stack, not reachable from this crate.
#   zbus_names, zvariant, zvariant_derive (unmaintained: merged into zbus 6):
#     keyring's Secret Service store, via secret-service 5 on zbus 5. Cleared by
#     `cargo update` once secret-service moves to zbus 6.
# Rust Doctor 0.8.0 has no per-advisory ignore, so these keep appearing.
# It also reports tauri 3.0.0-alpha.5 under RUSTSEC-2022-0088 and 0091 (Tauri 1,
# patched in 1.0.6 / 1.1.2): its version matching does not count a prerelease
# as newer. A false positive; `cargo audit` does not report it.
"rust_doctor::cargo::vulnerable_dependency" = "warn"
